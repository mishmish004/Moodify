version: '3.8'

services:
  logic:
    build: .
    container_name: moodify-logic
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      - redis
      - qdrant
    environment:
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant

  redis:
    image: redis:7-alpine
    container_name: moodify-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: moodify-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./.qdrant_storage:/qdrant/storage
