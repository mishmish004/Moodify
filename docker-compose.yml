services:
  app:
    build: .
    container_name: moodify-app
    ports:
      # Host 9091 matches the Spotify redirect URI; uvicorn listens on 8000 inside the container
      - "9091:8000"
    # Settings come from the host's .env at runtime; .env is never copied into the image
    env_file: .env
    volumes:
      - moodify-data:/app/data

volumes:
  moodify-data:
