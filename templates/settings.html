{% extends "base.html" %}
{% block title %}Moodify · settings{% endblock %}
{% set svc = service_info(user.service) %}
{% block content %}
<div class="mf-stack-6" style="max-width: 640px; margin: 0 auto">
  <h1 class="mf-h1">Settings</h1>
  <form method="post" action="/settings" class="mf-stack-5">
    <label class="mf-switch"><input type="checkbox" name="likes_to_service" value="on" {% if user.likes_to_service %}checked{% endif %}><span class="mf-switch__track" aria-hidden="true"><span class="mf-switch__thumb"></span></span><span class="mf-stack-2"><span class="mf-strong">{% if svc.service == "youtube" %}Also like songs on YouTube when I ♥ them in Moodify{% else %}Also add likes to my {{ svc.name }} {{ svc.likes }}{% endif %}</span><span class="mf-hint">When you ♥ a song in Moodify it's saved to your {{ svc.likes }} too. Unliking it takes it out again, but only if Moodify put it there.</span></span></label>
    <label class="mf-switch"><input type="checkbox" name="open_app" value="on" {% if user.open_app %}checked{% endif %}><span class="mf-switch__track" aria-hidden="true"><span class="mf-switch__thumb"></span></span><span class="mf-stack-2"><span class="mf-strong">Open {{ svc.name }} when my playlist is ready</span><span class="mf-hint">On {{ "an Android phone" if svc.service == "youtube" else "a phone" }}, the {{ svc.name }} app opens on your new playlist by itself. Some browsers ask first or need a tap; the {{ "OPEN SPOTIFY" if svc.service == "spotify" else "Open in " ~ svc.name }} button always works.</span></span></label>
    <button class="mf-btn mf-btn--primary" type="submit" style="align-self: flex-start">Save</button>
  </form>
</div>
{% endblock %}
