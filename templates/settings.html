{% extends "base.html" %}
{% block title %}Moodify · settings{% endblock %}
{% block content %}
<h1>Settings</h1>
<form method="post" action="/settings">
  <label class="check"><input type="checkbox" name="likes_to_spotify" value="on" {% if user.likes_to_spotify %}checked{% endif %}> Also add likes to my Spotify Liked Songs</label>
  <small class="hint">When you ♥ a song in Moodify it's saved to your Liked Songs too. Unliking it takes it out again, but only if Moodify put it there.</small>
  <button type="submit">Save</button>
</form>
{% endblock %}
