<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Moodify{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <a class="brand" href="/">Moodify</a>
    {% if user %}
    <nav><a href="/">New playlist</a><a href="/history">History</a></nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Forms with data-busy submit once: a double tap on "Make a playlist" would make two.
    // pageshow puts the button back when the page returns from the back/forward cache.
    for (const form of document.querySelectorAll("form[data-busy]")) {
      const button = form.querySelector("button"), label = button.textContent;
      form.addEventListener("submit", () => { button.disabled = true; button.textContent = form.dataset.busy; });
      addEventListener("pageshow", () => { button.disabled = false; button.textContent = label; });
    }
  </script>
</body>
</html>
