<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Moodify{% endblock %}</title>
  {# Phase 7 moves this into a static CSS file #}
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: .6rem; font-size: 1rem; margin-top: .25rem; }
    button { margin-top: 1.5rem; padding: .8rem 1.4rem; font-size: 1rem; }
    small { font-weight: normal; color: #555; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
